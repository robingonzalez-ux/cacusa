# Config de wrangler SOLO para el Worker cacusa-square (square-payment-worker.js) —
# binding CRUZADO hacia la clase GiftCardLedger que vive en cacusa-admin (ver
# wrangler.admin.toml — desplegar ESE primero, esta clase tiene que existir antes
# de que este binding pueda resolverla).
#
# Es el mismo concepto que el Service Binding ADMIN_WORKER que este Worker ya usa
# (adminFetch(), ver cabecera de square-payment-worker.js) pero de tipo Durable
# Object en vez de Service — permite reservar/confirmar/liberar saldo de la MISMA
# tarjeta de regalo sin importar desde cuál de los 2 Workers se llame, porque
# ambos apuntan al mismo namespace/clase (script_name abajo).
#
# Deploy (una sola vez, después de wrangler.admin.toml):
#   wrangler deploy --config wrangler.square.toml
# Después de este primer deploy, los cambios normales al CUERPO de
# square-payment-worker.js pueden seguir pegándose en el dashboard como siempre.
#
# INCIDENTE (19 sep, mismo día) — este archivo NO declaraba los bindings que
# cacusa-square YA tenía configurados a mano (CACUSA_KV, ADMIN_WORKER) —
# `wrangler deploy` los pisó/borró al no estar acá (ver el mismo aviso en
# wrangler.admin.toml, con el detalle completo). Arreglo inmediato: volver a
# agregarlos a mano en Cloudflare → cacusa-square → Settings → Bindings → Add
# (KV Namespace `CACUSA_KV`, Service binding `ADMIN_WORKER` → Worker
# cacusa-admin). Quedan también declarados abajo — el `id` de KV es un
# placeholder, reemplazar por el real antes de volver a correr wrangler.

name = "cacusa-square"
main = "square-payment-worker.js"
compatibility_date = "2026-09-19"

[[durable_objects.bindings]]
name = "GIFT_CARD_LEDGER"
class_name = "GiftCardLedger"
script_name = "cacusa-admin"

[[kv_namespaces]]
binding = "CACUSA_KV"
id = "REEMPLAZAR_CON_EL_ID_REAL_DEL_NAMESPACE"

[[services]]
binding = "ADMIN_WORKER"
service = "cacusa-admin"

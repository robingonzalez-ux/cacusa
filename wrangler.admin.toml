# Config de wrangler SOLO para el Worker cacusa-admin (admin-worker.js) — paso
# manual único para crear las clases de Durable Object GiftCardLedger (auditoría de
# integridad, 19 sep: cierra el doble-gasto real de gift cards, F03-a/F06) y
# OrderIdempotency (auditoría externa, 22 sep — S04: cierra la carrera real de
# pedidos/envíos duplicados, ver el comentario largo junto a esa clase en
# admin-worker.js).
#
# Por qué hace falta esto y los demás Workers no lo necesitan: los 4 Workers de este
# repo se despliegan siempre pegando el código en el dashboard de Cloudflare (Edit
# code → Deploy) — nunca con `wrangler`. Pero declarar una clase de Durable Object
# NUEVA requiere una migración (`[[migrations]] new_classes = [...]`), y esa
# migración normalmente solo se aplica con `wrangler deploy`, no alcanza con pegar
# el código en el editor del dashboard. Antes de instalar wrangler, vale la pena
# revisar si el dashboard de Cloudflare ya permite crear un Durable Object namespace
# nuevo sin CLI (Worker cacusa-admin → Settings → Bindings → Add → buscar "Durable
# Object") — Cloudflare viene agregando soporte a esto, pero no se pudo confirmar
# desde este entorno (sin acceso a la cuenta real de Cloudflare).
#
# Pasos (una sola vez):
#   1. npm install -g wrangler   (o npx wrangler, sin instalar global)
#   2. wrangler login            (autoriza contra la cuenta real de Cloudflare)
#   3. wrangler deploy --config wrangler.admin.toml
#      Esto sube admin-worker.js TAL CUAL (mismo código que ya se pega a mano) y,
#      de paso, aplica las migraciones pendientes (GiftCardLedger si es la primera
#      vez, OrderIdempotency si ya se hizo el primer deploy antes del 22 sep —
#      wrangler solo aplica la migración NUEVA que todavía no corrió, sin tocar la
#      que ya se aplicó). Después de que TODAS las clases declaradas ya tengan su
#      migración aplicada, editar el cuerpo de cualquiera de las 2 (sin renombrarlas)
#      puede seguir pegándose en el dashboard como siempre — solo hace falta volver
#      a correr wrangler si se agrega OTRA clase de Durable Object nueva.
#   4. En cacusa-square (el otro Worker que necesita la MISMA tarjeta de
#      GiftCardLedger — OrderIdempotency no la necesita, solo la usa admin-worker.js),
#      agregar el binding cruzado — ver wrangler.square.toml.
#
# Corregido el 19 sep — primer intento real de deploy: en el plan gratuito de
# Cloudflare, una clase de Durable Object nueva SOLO se puede crear con storage
# SQLite (`new_sqlite_classes`), no con el storage clásico (`new_classes`, error
# real visto: "In order to use Durable Objects with a free plan, you must create
# a namespace using a 'new_sqlite_classes' migration. [code: 10097]"). No hace
# falta tocar nada del código de la clase — la API de `this.state.storage`
# (get/put/delete/list, `setAlarm`) es la misma en los 2 tipos de storage.
#
# INCIDENTE (19 sep, mismo día) — este archivo NO declaraba los bindings que
# cacusa-admin YA tenía configurados a mano en el dashboard (CACUSA_KV,
# LOVERS_WEBHOOK) — `wrangler deploy` toma el wrangler.toml como fuente única de
# verdad de los bindings del Worker, así que el primer deploy real los borró sin
# avisar. Síntoma: "KV no configurado" al mandar códigos de bienvenida desde el
# panel. Arreglo inmediato (sin código): volver a agregarlos a mano en
# Cloudflare → cacusa-admin → Settings → Bindings → Add — un KV Namespace
# (variable CACUSA_KV) y un Service binding (variable LOVERS_WEBHOOK → Worker
# cacusa-lovers-webhook). Quedan también declarados abajo para que un futuro
# `wrangler deploy` no los vuelva a pisar — PERO el `id` del namespace de KV es
# un placeholder: hay que reemplazarlo por el ID real (Cloudflare → Workers KV →
# click en el namespace → el ID está en la URL, o correr
# `wrangler kv namespace list`) antes de volver a correr wrangler alguna vez.
# Mientras el `id` sea el placeholder, NO volver a correr `wrangler deploy` con
# este archivo — solo sirve como referencia de qué bindings debe tener el Worker.

name = "cacusa-admin"
main = "admin-worker.js"
compatibility_date = "2026-09-19"

[[durable_objects.bindings]]
name = "GIFT_CARD_LEDGER"
class_name = "GiftCardLedger"

[[durable_objects.bindings]]
name = "ORDER_IDEMPOTENCY"
class_name = "OrderIdempotency"

[[migrations]]
tag = "v1-giftcardledger"
new_sqlite_classes = ["GiftCardLedger"]

# Migración nueva (22 sep) — una clase de Durable Object NUEVA necesita su propia
# entrada de migración (agregarla a la de arriba no la aplicaría; los tags de
# migración son incrementales, nunca se reescribe uno ya aplicado).
[[migrations]]
tag = "v2-orderidempotency"
new_sqlite_classes = ["OrderIdempotency"]

[[kv_namespaces]]
binding = "CACUSA_KV"
id = "REEMPLAZAR_CON_EL_ID_REAL_DEL_NAMESPACE"

[[services]]
binding = "LOVERS_WEBHOOK"
service = "cacusa-lovers-webhook"

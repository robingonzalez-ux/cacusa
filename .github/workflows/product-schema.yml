name: Regenerar JSON-LD y sitemap de productos

# Cada vez que data/products.json cambia en main (ej. una edición desde el panel
# admin, que comitea directo por la API de GitHub — alta, edición o eliminación
# de un producto, o un cambio de precio/envío/materiales), regenera cuatro
# cosas y las comitea de vuelta:
#   1. El bloque estático de JSON-LD (schema.org Product) en
#      ui_kits/store/index.html y en/ui_kits/store/index.html — así el HTML que
#      sirve GitHub Pages siempre trae el schema actualizado, sin depender de
#      que se ejecute JavaScript en el navegador.
#   2. Una URL propia por producto (ES + EN) en sitemap.xml — así cada
#      producto nuevo entra solo al sitemap, y uno eliminado se quita solo,
#      sin que nadie tenga que acordarse de tocarlo a mano.
#   3. El catálogo de respaldo dentro de <noscript> en ambos index.html — el
#      único contenido de producto que ve un bot/IA que no ejecuta JS. Antes
#      se escribía a mano y quedaba desactualizado; ahora se regenera del
#      catálogo real cada vez, agrupado por categoría.
#   4. Los datos numéricos de llms.txt (rango de precios, lista de
#      materiales, umbral de envío gratis, precios de Cacusa Lovers) entre
#      marcadores <!--LLMS:NOMBRE-->...<!--/LLMS:NOMBRE-->. El resto de
#      llms.txt (prosa, WhatsApp, redes, políticas) sigue siendo manual —
#      ver el encabezado de generate_llms_facts.py para el detalle de qué
#      se automatiza y qué no.
#
# No entra en loop: este workflow solo mira cambios en data/products.json, y su
# propio commit únicamente toca los index.html, sitemap.xml y llms.txt —
# nunca products.json — así que no se vuelve a disparar a sí mismo.
on:
  push:
    branches: [main]
    paths:
      - "data/products.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generar JSON-LD estático
        run: python3 .github/scripts/generate_product_schema.py

      - name: Generar URLs de producto en el sitemap
        run: python3 .github/scripts/generate_sitemap_products.py

      - name: Regenerar catálogo <noscript>
        run: python3 .github/scripts/generate_noscript_catalog.py

      - name: Regenerar datos numéricos de llms.txt
        run: python3 .github/scripts/generate_llms_facts.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "cacusa-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- ui_kits/store/index.html en/ui_kits/store/index.html sitemap.xml llms.txt; then
            echo "Sin cambios."
            exit 0
          fi
          git add ui_kits/store/index.html en/ui_kits/store/index.html sitemap.xml llms.txt
          git commit -m "Regenerar JSON-LD, sitemap, catálogo noscript y datos de llms.txt [skip ci]"
          git push

name: Regenerar guías en inglés (en/*.html)

# Las 9 guías (cuidados, envíos, devoluciones, tallas, regalos, etc.) se
# escriben en español con su diccionario de traducción en el propio JS
# (data-i18n + I18N_EN, o config.translations.en / pages_en de
# data/products.json). Para que Google vea la versión en inglés como URL
# propia, generate_en_guides.py produce en/<guía>.html estático a partir del
# archivo en español — este workflow lo corre cada vez que cambia una guía,
# el script, o data/products.json (de ahí salen los textos EN de envíos/
# cuidados/devoluciones y las URLs EN de los productos enlazados).
#
# No entra en loop: su commit solo toca en/<guía>.html, que no está en el
# filtro de paths de abajo (y además un push hecho con GITHUB_TOKEN no
# dispara otros workflows).
on:
  push:
    branches: [main]
    paths:
      - "cuidados.html"
      - "envios.html"
      - "devoluciones.html"
      - "guia-tallas.html"
      - "guia-regalos.html"
      - "guias.html"
      - "significado-piedras.html"
      - "como-combinar-joyas.html"
      - "regalos-hombre-y-joyeria-religiosa.html"
      - "data/products.json"
      - ".github/scripts/generate_en_guides.py"
      - ".github/scripts/generate_product_schema.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: en-guides
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generar guías en inglés
        run: python3 .github/scripts/generate_en_guides.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "cacusa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add en/cuidados.html en/envios.html en/devoluciones.html en/guia-tallas.html \
                  en/guia-regalos.html en/guias.html en/significado-piedras.html \
                  en/como-combinar-joyas.html en/regalos-hombre-y-joyeria-religiosa.html
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Regenerar guías en inglés (en/*.html) [skip ci]"
          # Mismo criterio que product-schema.yml: si main avanzó mientras corría
          # (ej. una edición del admin), rebasar y reintentar. Este commit solo toca
          # en/<guía>.html, así que no choca con los commits del admin ni del otro bot.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (main avanzó mientras corría este job) — reintentando con rebase ($i/5)..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Conflicto al rebasar: una corrida más nueva ya regenera desde datos más recientes."
              git rebase --abort
              exit 0
            fi
          done
          echo "No se pudo pushear tras varios intentos — la próxima edición de una guía dispara una corrida nueva."
